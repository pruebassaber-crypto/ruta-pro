<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Pro - CUN</title>
<link rel="stylesheet" href="estilos.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<main id="game-container" aria-label="Ruta Pro">
<button type="button" id="music-toggle" class="music-toggle hidden" aria-label="Silenciar música de aventura" aria-pressed="false">Música: encendida</button>
<section id="login-screen">
<form id="login-form" class="intro-card">
<h1>RUTA PRO</h1>
<label for="student-name">Nombre completo</label>
<input id="student-name" name="nombre" autocomplete="name" maxlength="120" required>
<label for="student-id">ID estudiante</label>
<input id="student-id" name="id" maxlength="50" required>
<label for="student-email">Correo institucional</label>
<input type="email" id="student-email" name="correo" autocomplete="email" maxlength="160" required>
<p>¿Estás listo para la aventura?</p>
<button type="submit" class="pixel-btn">Ingresar</button>
</form>
</section>
<section id="canvas-screen" class="hidden" aria-label="Exploración">
<canvas id="gameCanvas" width="1000" height="562" tabindex="0" aria-label="Usa flechas o WASD para moverte. Acércate al objeto resaltado y pulsa Espacio."></canvas>
<div id="scene-label" class="scene-label"></div>
<div id="scene-objective" class="scene-objective" aria-live="polite"></div>
<div class="controls-hint">FLECHAS / WASD: MOVERSE · ESPACIO: INTERACTUAR</div>
<div id="game-notice" role="status" class="hidden"></div>
<div class="touch-controls" aria-label="Controles táctiles">
<button type="button" data-key="ArrowLeft" aria-label="Izquierda">←</button>
<button type="button" data-key="ArrowUp" aria-label="Arriba">↑</button>
<button type="button" data-key="ArrowDown" aria-label="Abajo">↓</button>
<button type="button" data-key="ArrowRight" aria-label="Derecha">→</button>
<button type="button" id="touch-interact">Interactuar</button>
</div>
</section>
<section id="results-screen" class="hidden" aria-label="Resultados de Ruta Pro"></section>
<div id="modal-layer" class="hidden">
<section id="interaction-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
<header class="modal-header"><img id="modal-object-img" alt="" class="hidden"><h2 id="modal-title"></h2></header>
<div id="modal-scroll"><div id="modal-content"></div><div id="modal-actions"></div></div>
<button type="button" id="modal-close" class="secondary-btn">Volver al escenario</button>
</section>
</div>
</main>
<script src="js/conexion.js"></script>
<script src="js/motor.js"></script>
<script src="js/musica.js"></script>
<script src="js/opciones.js"></script>
<script src="js/recorrido.js"></script>
<script src="js/lecturaCritica.js"></script>
<script src="js/competenciasCiudadanas.js"></script>
<script src="js/ingles.js"></script>
<script src="js/escenasIngles.js"></script>
<script src="js/comunicacionEscrita.js"></script>
<script src="js/escenasEscrita.js"></script>
<script src="js/razonamientoCuantitativo.js"></script>
<script src="js/escenasCuantitativo.js"></script>
<script src="js/escenasCiudadanas.js"></script>
<script src="js/escena0.js"></script>
<script src="js/escena1.js"></script>
<script src="js/escena2.js"></script>
<script src="js/escena3.js"></script>
<script src="js/escena4.js"></script>
</body>
</html>
